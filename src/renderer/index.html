<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- worker-src blob: is required by the SmartSpectra renderer SDK (step 3) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MannDaan</title>
  <style>
    :root {
      --ink: #e8e4d8;
      --dim: #8a8fa6;
      --dimmer: #5a5f76;
      --warm: #e8b36a;
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #04050d;
      color: var(--ink);
      font-family: Georgia, 'Noto Serif', 'Noto Serif Devanagari', serif;
      overflow: hidden;
      cursor: default;
    }
    #scene { display: block; width: 100vw; height: 100vh; }

    /* ---- overlay screens ---- */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 0 16px;
      transition: opacity 1.6s ease;
      background: transparent;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay.scrim { background: rgba(3, 4, 10, 0.88); }

    .line {
      font-size: clamp(18px, 2.4vw, 26px);
      font-style: italic;
      color: var(--ink);
      opacity: 0;
      transition: opacity 2.2s ease;
      max-width: 34em;
      line-height: 1.6;
    }
    .line.show { opacity: 0.92; }

    .title {
      font-size: clamp(42px, 6vw, 72px);
      letter-spacing: 0.12em;
      font-style: normal;
      color: var(--ink);
    }
    .title .hindi {
      display: block;
      font-size: 0.42em;
      letter-spacing: 0.3em;
      color: var(--warm);
      opacity: 0.85;
      margin-top: 0.4em;
      font-style: normal;
    }
    .tagline {
      font-size: clamp(14px, 1.6vw, 18px);
      color: var(--dim);
      margin-top: 1.6em;
    }

    .consent-box {
      max-width: 36em;
      text-align: left;
      font-size: 15px;
      line-height: 1.75;
      color: var(--ink);
      background: rgba(10, 12, 24, 0.7);
      border: 1px solid rgba(138, 143, 166, 0.25);
      border-radius: 6px;
      padding: 28px 34px;
    }
    .consent-box h2 {
      font-weight: normal; font-size: 19px; margin: 0 0 14px;
      color: var(--warm); letter-spacing: 0.06em;
    }
    .consent-box ul { margin: 10px 0; padding-left: 1.2em; }
    .consent-box li { margin: 7px 0; color: #cfcabd; }
    .consent-box .fine { font-size: 12.5px; color: var(--dimmer); margin-top: 14px; }

    .btnrow { margin-top: 26px; display: flex; gap: 18px; justify-content: center; }
    button {
      font-family: inherit; font-size: 15px;
      color: var(--ink);
      background: transparent;
      border: 1px solid rgba(232, 179, 106, 0.55);
      border-radius: 3px;
      padding: 10px 26px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.4s, color 0.4s;
    }
    button:hover { background: rgba(232, 179, 106, 0.16); }
    button.quiet { border-color: rgba(138, 143, 166, 0.35); color: var(--dim); }

    #worry-input {
      font-family: inherit; font-style: italic;
      font-size: clamp(17px, 2vw, 22px);
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(138, 143, 166, 0.4);
      outline: none;
      text-align: center;
      width: min(80vw, 30em);
      padding: 8px 4px;
      caret-color: var(--warm);
    }
    #worry-input::placeholder { color: var(--dimmer); font-style: italic; }

    .hintline {
      position: fixed; top: 12vh; left: 0; right: 0;
      text-align: center;
      font-style: italic;
      font-size: clamp(15px, 1.8vw, 19px);
      color: rgba(232, 228, 216, 0.8);
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }
    .hintline.show { opacity: 1; }

    #readout {
      position: fixed; right: 18px; bottom: 14px;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 12px; line-height: 1.7; color: var(--dimmer);
      text-align: right; user-select: none;
      opacity: 0;
      transition: opacity 1.5s;
    }
    #readout.show { opacity: 0.9; }
    #readout .stable { color: #9fc49a; }
    #readout .unstable { color: #b08a6a; }

    #mockhelp {
      position: fixed; left: 18px; bottom: 14px;
      font-family: ui-monospace, monospace; font-size: 11px;
      color: var(--dimmer); opacity: 0.55; user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hintline" id="hintline"></div>
  <div id="overlay"></div>
  <div id="readout"></div>
  <div id="mockhelp" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
