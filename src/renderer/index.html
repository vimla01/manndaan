<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- worker-src blob: is required by the SmartSpectra renderer SDK (step 3) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MannDaan</title>
  <style>
    /* Bundled fonts — SIL OFL 1.1, license texts in fonts/OFL-*.txt */
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: normal; font-weight: 500;
      src: url(fonts/cormorant-garamond.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Cormorant Garamond';
      font-style: italic; font-weight: 500;
      src: url(fonts/cormorant-garamond-italic.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal; font-weight: 400;
      src: url(fonts/inter-400.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal; font-weight: 500;
      src: url(fonts/inter-500.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Tiro Devanagari Hindi';
      font-style: normal; font-weight: 400;
      src: url(fonts/tiro-devanagari-hindi.woff2) format('woff2');
    }
    :root {
      --ink: #e8e4d8;
      --dim: #8a8fa6;
      --dimmer: #5a5f76;
      --warm: #e8b36a;
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #04050d;
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      overflow: hidden;
      cursor: default;
    }
    #scene { display: block; width: 100vw; height: 100vh; }

    /* ---- overlay screens ---- */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 0 16px;
      transition: opacity 1.6s ease;
      background: transparent;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay.scrim { background: rgba(3, 4, 10, 0.88); }

    .line {
      font-size: clamp(18px, 2.4vw, 26px);
      font-style: italic;
      color: var(--ink);
      opacity: 0;
      transition: opacity 2.2s ease;
      max-width: 34em;
      line-height: 1.6;
    }
    .line.show { opacity: 0.92; }

    .title {
      font-size: clamp(42px, 6vw, 72px);
      letter-spacing: 0.12em;
      font-style: normal;
      color: var(--ink);
    }
    .title .hindi {
      display: block;
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: 0.42em;
      letter-spacing: 0.3em;
      color: var(--warm);
      opacity: 0.85;
      margin-top: 0.4em;
      font-style: normal;
    }
    .tagline {
      font-size: clamp(14px, 1.6vw, 18px);
      color: var(--dim);
      margin-top: 1.6em;
    }

    .consent-box {
      max-width: 36em;
      text-align: left;
      font-size: 16.5px;
      line-height: 1.75;
      color: var(--ink);
      background: rgba(10, 12, 24, 0.7);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      border: 1px solid rgba(138, 143, 166, 0.25);
      border-radius: 6px;
      padding: 28px 34px;
    }
    .consent-box h2 {
      font-weight: normal; font-size: 19px; margin: 0 0 14px;
      color: var(--warm); letter-spacing: 0.06em;
    }
    .consent-box ul { margin: 10px 0; padding-left: 1.2em; }
    .consent-box li { margin: 10px 0; line-height: 1.4; color: #cfcabd; }
    .consent-box li b { color: var(--ink); font-weight: 600; }
    .consent-box .subtitle { font-style: italic; color: #c3bdae; margin: 0 0 14px; }
    .consent-box .closing { font-style: italic; color: #aea89a; margin-top: 16px; }
    .consent-box details { margin-top: 20px; }
    .consent-box summary {
      cursor: pointer; list-style: none;
      font-family: 'Inter', sans-serif;
      font-size: 12px; color: var(--dimmer);
      user-select: none;
    }
    .consent-box summary::-webkit-details-marker { display: none; }
    .consent-box summary::before { content: '\25B8\00a0'; }
    .consent-box details[open] summary::before { content: '\25BE\00a0'; }
    .consent-box details p {
      font-family: 'Inter', sans-serif;
      font-size: 12px; color: var(--dimmer);
      line-height: 1.65; margin: 8px 0 0;
    }

    .btnrow { margin-top: 26px; display: flex; gap: 18px; justify-content: center; }
    button {
      font-family: 'Inter', sans-serif; font-size: 13.5px;
      color: var(--ink);
      background: transparent;
      border: 1px solid rgba(232, 179, 106, 0.55);
      border-radius: 3px;
      padding: 10px 26px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.4s, color 0.4s;
    }
    button:hover { background: rgba(232, 179, 106, 0.16); }
    button.quiet { border-color: rgba(138, 143, 166, 0.35); color: var(--dim); }
    button.soft {
      border-color: rgba(232, 179, 106, 0.28);
      color: rgba(232, 228, 216, 0.75);
      background: rgba(10, 12, 24, 0.4);
    }
    button.soft:hover { border-color: rgba(232, 179, 106, 0.6); color: var(--ink); }

    #mocktag {
      position: fixed; top: 14px; right: 18px;
      font-family: 'Inter', sans-serif; font-size: 11px;
      color: var(--dimmer); opacity: 0.55; user-select: none;
    }
    #worry-input {
      display: block;
      margin: 0 auto;
      font-family: inherit; font-style: italic;
      font-size: clamp(17px, 2vw, 22px);
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(138, 143, 166, 0.4);
      outline: none;
      text-align: center;
      width: min(80vw, 30em);
      padding: 8px 4px;
      caret-color: var(--warm);
    }
    #worry-input::placeholder { color: var(--dimmer); font-style: italic; }

    .hintline {
      position: fixed; top: 12vh; left: 50%;
      transform: translateX(-50%);
      width: min(86vw, 34em);
      text-align: center;
      font-style: italic;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.5;
      overflow-wrap: break-word;
      color: rgba(232, 228, 216, 0.8);
      opacity: 0;
      transition: opacity 1.2s ease;
      pointer-events: none;
    }
    .hintline.show { opacity: 1; }

    #readout {
      position: fixed; right: 18px; bottom: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px; line-height: 1.7; color: var(--dimmer);
      font-variant-numeric: tabular-nums;
      text-align: right; user-select: none;
      opacity: 0;
      transition: opacity 1.5s;
    }
    #readout.show { opacity: 0.9; }
    #readout .stable { color: #9fc49a; }
    #readout .unstable { color: #b08a6a; }

    #preview {
      position: fixed; left: 18px; bottom: 40px;
      width: 150px; border-radius: 4px;
      border: 1px solid rgba(138, 143, 166, 0.35);
      opacity: 0.8;
      transform: scaleX(-1); /* mirror, like looking at yourself */
    }
    #mockhelp {
      position: fixed; left: 18px; bottom: 14px;
      font-family: 'Inter', sans-serif; font-size: 11px;
      color: var(--dimmer); opacity: 0.55; user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hintline" id="hintline"></div>
  <div id="overlay"></div>
  <div id="mocktag" hidden>mock mode — camera off</div>
  <div id="readout"></div>
  <video id="preview" muted playsinline hidden></video>
  <div id="mockhelp" hidden></div>
  <script type="module" src="build/app.js"></script>
</body>
</html>
